[package]
name = "ytd"
version = "4.0.0"
edition = "2021"
description = "Desktop video downloader (GUI and CLI) built on yt-dlp and ffmpeg, with a download queue and auto-installed tools."
license = "ISC"
repository = "https://github.com/danted4/nodeytd"
readme = "readme.md"
keywords = ["youtube", "yt-dlp", "downloader", "ffmpeg", "gui"]
rust-version = "1.85"
default-run = "ytd"

[features]
default = []
gui = ["dep:eframe", "dep:rfd", "dep:open", "dep:image", "dep:winit"]
macos-app = []

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.11", default-features = false }
dirs = "6"
eframe = { version = "0.31", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
futures-util = "0.3"
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png", "webp"] }
indicatif = "0.17"
lzma-rs = "0.3"
open = { version = "5", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
rfd = { version = "0.15", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
# eframe 0.31 does not re-export `winit/default`; this unifies Linux CSD.
winit = { version = "0.30", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[lib]
name = "ytd"
path = "src/lib.rs"

[[bin]]
name = "ytd"
path = "src/main.rs"

[[bin]]
name = "ytd-gui"
path = "src/bin/ytd-gui.rs"
required-features = ["gui"]

[[bin]]
name = "macos-app"
path = "src/bin/macos-app.rs"
required-features = ["macos-app"]

[profile.release]
lto = "thin"
codegen-units = 1
